<!doctype html>

<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>玖拾课表</title>
    <!-- 字体：本地 CSS 声明 LXGW WenKai Bold 的 @font-face（已去除 local()，字体 woff2 分片直连 cn-font CDN，
         避免命中本地安装的 LXGW WenKai Regular 导致 Bold 不生效） -->
    <link rel="preconnect" href="https://cn-font.claude-code-best.win" crossorigin />
    <link rel="stylesheet" href="/lxgw-wenkai-bold.css" />
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
    <script>
      // 页面加载早期检测系统深色模式，避免页面闪烁
      (function () {
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && prefersDark) || savedTheme === 'auto' && prefersDark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
