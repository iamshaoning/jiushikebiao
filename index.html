<!doctype html>

<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>玖拾课表</title>
    <!-- 字体：本地 CSS 声明 LXGW WenKai Bold 的 @font-face（已去除 local()，字体 woff2 分片直连 cn-font CDN，
         避免命中本地安装的 LXGW WenKai Regular 导致 Bold 不生效）。
         font-display 为 block：分片加载期间不显示系统字体，避免字体闪换 -->
    <link rel="preconnect" href="https://cn-font.claude-code-best.win" crossorigin />
    <link rel="stylesheet" href="/lxgw-wenkai-bold.css" />
    <style>
      /* 启动遮罩：仅覆盖 JS 执行前的空白期，不做任何布局推测；
         React 挂载后由 main.tsx 直接基于真实 DOM 生成骨架 */
      html,
      body {
        background: #faf7f2;
      }
      #boot-skeleton {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf7f2;
        transition: opacity 0.25s ease;
      }
      #boot-skeleton.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .bs-splash {
        width: 40px;
        height: 40px;
        box-sizing: border-box;
        padding: 6px;
        border-radius: 12px;
        background: linear-gradient(140deg, #ebc57f, #c8842f);
        box-shadow: 0 6px 18px rgba(200, 132, 47, 0.28);
        animation: bs-pulse 1.4s ease-in-out infinite;
      }
      /* 与系统左上角 logo 一致：favicon 作为 mask + 白色填充 */
      .bs-splash-logo {
        width: 100%;
        height: 100%;
        background-color: #fff;
        -webkit-mask-image: url("./favicon.svg");
        mask-image: url("./favicon.svg");
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        -webkit-mask-size: contain;
        mask-size: contain;
      }
      @keyframes bs-pulse {
        0%,
        100% {
          opacity: 0.72;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bs-splash {
          animation: none;
        }
      }
    </style>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="boot-skeleton" aria-hidden="true">
      <div class="bs-splash"><div class="bs-splash-logo"></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
